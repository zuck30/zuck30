title: shadrackovsky
description: AI/ML & Software Engineer from Tanzania
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

baseurl: "/zuck30"
url: "https://zuck30.github.io"

exclude:
  - README.md
  - LICENSE
  - .gitignore
  - .DS_Store
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "assets"
    values:
      image: true

sass:
  style: compressed

minima:
  skin: dark
  social_links:
    github: zuck30
    twitter: sheddysilicon
    linkedin: