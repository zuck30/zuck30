<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <header class="header" role="banner">
      <div class="wrapper header-inner">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="{{ site.title }}">
          <span>{{ site.title }}</span>
        </a>
        
        <nav class="nav" role="navigation" aria-label="Main navigation">
          <a href="#about" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/4890/4890237.png" alt="" class="flaticon" aria-hidden="true">
            About
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <a href="#skills" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/9583/9583795.png" alt="" class="flaticon" aria-hidden="true">
            Skills
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <a href="#projects" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/12673/12673734.png" alt="" class="flaticon" aria-hidden="true">
            Projects
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <a href="#contact" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/15047/15047587.png" alt="" class="flaticon" aria-hidden="true">
            Contact
          </a>
        </nav>
        
        <div class="header-actions">
          <button class="search-btn" type="button" aria-label="Search (Cmd+K)">
            <kbd>⌘</kbd>K
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="theme-toggle" type="button" aria-label="Toggle theme">
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="https://github.com/zuck30" class="github-link" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          </a>
        </div>
      </div>
    </header>
    
    <main class="main" role="main">
      {{ content }}
    </main>
    
    <footer class="footer" role="contentinfo">
      <div class="wrapper footer-inner">
        <p class="footer-text">Built with Jekyll • Hosted on GitHub Pages</p>
        <div class="footer-social">
          <a href="https://sheddysilicon.netlify.app" target="_blank" rel="noopener" aria-label="Portfolio">
            <img src="https://cdn-icons-png.flaticon.com/128/1323/1323734.png" alt="" class="flaticon">
          </a>
          <a href="https://sheddydev.netlify.app/" target="_blank" rel="noopener" aria-label="Blog">
            <img src="https://cdn-icons-png.flaticon.com/128/3669/3669967.png" alt="" class="flaticon">
          </a>
          <a href="https://github.com/zuck30" target="_blank" rel="noopener" aria-label="GitHub">
            <img src="https://cdn-icons-png.flaticon.com/128/25/25471.png" alt="" class="flaticon">
          </a>
          <a href="https://instagram.com/sheddysilicon" target="_blank" rel="noopener" aria-label="Instagram">
            <img src="https://cdn-icons-png.flaticon.com/128/174/174855.png" alt="" class="flaticon">
          </a>
          <a href="https://antera.co.tz" target="_blank" rel="noopener" aria-label="Antera">
            <img src="https://cdn-icons-png.flaticon.com/128/1927/1927746.png" alt="" class="flaticon">
          </a>
        </div>
        <p class="footer-text">
          <span class="footer-name">shadrackovsky</span>
        </p>
      </div>
    </footer>
    
    <script>
      (function() {
        const themeToggle = document.querySelector('.theme-toggle');
        const sunIcon = themeToggle.querySelector('.sun-icon');
        const moonIcon = themeToggle.querySelector('.moon-icon');
        
        function setTheme(dark) {
          if (dark) {
            document.documentElement.style.setProperty('--bg', '#0f0f11');
            document.documentElement.style.setProperty('--bg-elevated', '#141417');
            document.documentElement.style.setProperty('--bg-card', '#18181c');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
          } else {
            document.documentElement.style.setProperty('--bg', '#ffffff');
            document.documentElement.style.setProperty('--bg-elevated', '#fafafa');
            document.documentElement.style.setProperty('--bg-card', '#ffffff');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
          }
        }
        
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
        setTheme(isDark);
        
        themeToggle.addEventListener('click', function() {
          const newDark = !document.documentElement.style.getPropertyValue('--bg').includes('0f0f11');
          setTheme(newDark);
          localStorage.setItem('theme', newDark ? 'dark' : 'light');
        });
      })();
    </script>
  </body>
</html>
