<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/4883/4883943.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/4883/4883943.png">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <header class="header" role="banner">
      <div class="wrapper header-inner">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="{{ site.title }}">
          <span>SHADRACKOVSKY</span>
        </a>
        
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
          <span class="hamburger"></span>
        </button>
        
        <nav class="nav" id="main-nav" role="navigation" aria-label="Main navigation">
          <a href="#about" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/4890/4890237.png" alt="" class="flaticon" aria-hidden="true">
            About
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <a href="#skills" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/9583/9583795.png" alt="" class="flaticon" aria-hidden="true">
            Skills
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <a href="#projects" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/12673/12673734.png" alt="" class="flaticon" aria-hidden="true">
            Projects
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <a href="#contact" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/128/15047/15047587.png" alt="" class="flaticon" aria-hidden="true">
            Contact
          </a>
        </nav>
        
        <div class="header-actions">
          <button class="search-btn" type="button" aria-label="Search (Cmd+K)" aria-keyshortcuts="Meta+K Control+K">
            <kbd>⌘</kbd>K
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="theme-toggle" type="button" aria-label="Toggle theme">
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="https://github.com/zuck30" class="github-link" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          </a>
        </div>
      </div>
    </header>
    
    <main class="main" role="main">
      {{ content }}
    </main>
    
    <footer class="footer" role="contentinfo">
      <div class="wrapper footer-top">
        <div class="footer-col">
          <h2 class="footer-heading">Quick Links</h2>
          <ul class="footer-links">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="{{ '/profile/shadrack-profile.pdf' | relative_url }}" download>CV</a></li>
          </ul>
        </div>
        <div class="footer-col footer-col-right">
          <h2 class="footer-heading">Connect</h2>
          <div class="footer-social">
            <a href="https://antera.co.tz/blog" target="_blank" rel="noopener" aria-label="Blog">
              <img src="https://cdn-icons-png.flaticon.com/128/3669/3669967.png" alt="" class="flaticon">
            </a>
            <a href="https://github.com/zuck30" target="_blank" rel="noopener" aria-label="GitHub">
              <img src="https://cdn-icons-png.flaticon.com/128/5968/5968846.png" alt="" class="flaticon">
            </a>
            <a href="https://instagram.com/sheddysilicon" target="_blank" rel="noopener" aria-label="Instagram">
              <img src="https://cdn-icons-png.flaticon.com/128/174/174855.png" alt="" class="flaticon">
            </a>
            <a href="https://antera.co.tz" target="_blank" rel="noopener" aria-label="Antera">
              <img src="https://cdn-icons-png.flaticon.com/128/1927/1927746.png" alt="" class="flaticon">
            </a>
          </div>
        </div>
      </div>

      <div class="footer-wordmark" aria-hidden="true">shadrackovsky</div>

      <div class="footer-bottom">
        <p>&copy; 2026 shadrackovsky &middot; Built with Jekyll &middot; Hosted on GitHub Pages</p>
      </div>
    </footer>

    <div class="command-overlay" id="commandPalette" role="dialog" aria-modal="true" aria-label="Quick navigation">
      <div class="command-palette">
        <div class="command-field">
          <span class="command-search-icon" aria-hidden="true"></span>
          <input type="text" id="commandInput" class="command-input" placeholder="Jump to a section or project" aria-label="Search sections and projects" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="commandList">
        </div>
        <ul class="command-list" id="commandList" role="listbox" aria-label="Results"></ul>
        <div class="command-foot">
          <span class="command-group">
            <button class="command-key" type="button" data-command="up" aria-label="previous result" title="previous result"><span class="command-key-icon command-key-up"></span></button>
            <button class="command-key" type="button" data-command="down" aria-label="next result" title="next result"><span class="command-key-icon command-key-down"></span></button>
            <span class="command-label">move</span>
          </span>
          <span class="command-group">
            <button class="command-key" type="button" data-command="enter" aria-label="open selected result" title="open selected result"><span class="command-key-icon command-key-enter"></span></button>
            <span class="command-label">open</span>
          </span>
          <span class="command-group">
            <button class="command-key" type="button" data-command="escape" aria-label="close palette" title="close palette"><span class="command-key-icon command-key-escape"></span></button>
            <span class="command-label">close</span>
          </span>
        </div>
      </div>
    </div>

    <script>
      (function() {
        const themeToggle = document.querySelector('.theme-toggle');
        const sunIcon = themeToggle.querySelector('.sun-icon');
        const moonIcon = themeToggle.querySelector('.moon-icon');
        
        function setTheme(dark) {
          if (dark) {
            document.documentElement.style.setProperty('--bg', '#0f0f11');
            document.documentElement.style.setProperty('--bg-elevated', '#141417');
            document.documentElement.style.setProperty('--bg-card', '#18181c');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
          } else {
            document.documentElement.style.setProperty('--bg', '#ffffff');
            document.documentElement.style.setProperty('--bg-elevated', '#fafafa');
            document.documentElement.style.setProperty('--bg-card', '#ffffff');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
          }
        }
        
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
        setTheme(isDark);
        
        themeToggle.addEventListener('click', function() {
          const newDark = !document.documentElement.style.getPropertyValue('--bg').includes('0f0f11');
          setTheme(newDark);
          localStorage.setItem('theme', newDark ? 'dark' : 'light');
        });
      })();
    </script>

    <script>
      (function() {
        const overlay = document.getElementById('commandPalette');
        const input = document.getElementById('commandInput');
        const list = document.getElementById('commandList');
        const foot = document.querySelector('.command-foot');
        const searchBtn = document.querySelector('.search-btn');
        if (!overlay || !input || !list) return;

        const sections = [
          { label: 'About', href: '#about', kind: 'Section' },
          { label: 'Skills', href: '#skills', kind: 'Section' },
          { label: 'Roadmap', href: '#roadmap', kind: 'Section' },
          { label: 'Personality', href: '#personality', kind: 'Section' },
          { label: 'Projects', href: '#projects', kind: 'Section' },
          { label: 'Contact', href: '#contact', kind: 'Section' },
          { label: 'Download CV', href: '{{ "/profile/shadrack-profile.pdf" | relative_url }}', kind: 'Document', external: true }
        ];

        const projects = Array.from(document.querySelectorAll('.project-gallery-item'))
          .map(function(item) {
            const caption = item.querySelector('.project-caption');
            return caption ? { label: caption.textContent.trim(), el: item, kind: 'Project' } : null;
          })
          .filter(Boolean);

        const items = sections.concat(projects);
        let filtered = items.slice();
        let activeIndex = 0;
        let previousFocus = null;

        function setActive(i) {
          if (!filtered.length) return;
          activeIndex = Math.max(0, Math.min(i, filtered.length - 1));
          Array.from(list.children).forEach(function(child, idx) {
            const on = idx === activeIndex;
            child.classList.toggle('active', on);
            child.setAttribute('aria-selected', on ? 'true' : 'false');
            if (on) input.setAttribute('aria-activedescendant', child.id);
          });
          const active = list.children[activeIndex];
          if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
        }

        function move(step) {
          if (!filtered.length) return;
          let next = activeIndex + step;
          if (next < 0) next = filtered.length - 1;
          if (next >= filtered.length) next = 0;
          setActive(next);
        }

        function render() {
          list.innerHTML = '';
          if (!filtered.length) {
            const empty = document.createElement('li');
            empty.className = 'command-empty';
            empty.textContent = 'nothing matches that.';
            list.appendChild(empty);
            input.removeAttribute('aria-activedescendant');
            return;
          }
          filtered.forEach(function(item, i) {
            const li = document.createElement('li');
            li.id = 'command-hit-' + i;
            li.className = 'command-item' + (i === activeIndex ? ' active' : '');
            li.setAttribute('role', 'option');
            li.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');

            const label = document.createElement('span');
            label.className = 'command-label-text';
            label.textContent = item.label;

            const kind = document.createElement('span');
            kind.className = 'command-kind';
            kind.textContent = item.kind;

            li.appendChild(label);
            li.appendChild(kind);

            li.addEventListener('click', function() { select(i); });
            li.addEventListener('mouseenter', function() { setActive(i); });

            list.appendChild(li);
          });
          input.setAttribute('aria-activedescendant', 'command-hit-' + activeIndex);
          setActive(activeIndex);
        }

        function select(i) {
          const item = filtered[i];
          if (!item) return;
          close();
          if (item.external) {
            window.open(item.href, '_blank', 'noopener');
            return;
          }
          if (item.el) {
            item.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            const target = document.querySelector(item.href);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }

        function open() {
          previousFocus = document.activeElement;
          overlay.classList.add('open');
          document.body.style.overflow = 'hidden';
          input.setAttribute('aria-expanded', 'true');
          input.value = '';
          filtered = items.slice();
          activeIndex = 0;
          render();
          input.focus();
        }

        function close() {
          if (!overlay.classList.contains('open')) return;
          overlay.classList.remove('open');
          document.body.style.overflow = '';
          input.setAttribute('aria-expanded', 'false');
          if (previousFocus && previousFocus.focus) previousFocus.focus();
          else if (searchBtn) searchBtn.focus();
        }

        if (searchBtn) searchBtn.addEventListener('click', open);

        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) close();
        });

        if (foot) {
          foot.addEventListener('click', function(e) {
            const btn = e.target && e.target.closest ? e.target.closest('[data-command]') : null;
            if (!btn) return;
            const action = btn.getAttribute('data-command');
            if (action === 'up') move(-1);
            else if (action === 'down') move(1);
            else if (action === 'enter') select(activeIndex);
            else if (action === 'escape') close();
          });
        }

        document.addEventListener('keydown', function(e) {
          if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') {
            e.preventDefault();
            if (overlay.classList.contains('open')) { close(); } else { open(); }
          }
          if (e.key === 'Escape' && overlay.classList.contains('open')) close();
        });

        input.addEventListener('input', function() {
          const q = input.value.trim().toLowerCase();
          filtered = q ? items.filter(function(item) {
            return item.label.toLowerCase().indexOf(q) !== -1;
          }) : items.slice();
          activeIndex = 0;
          render();
        });

        input.addEventListener('keydown', function(e) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            move(1);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            move(-1);
          } else if (e.key === 'Home') {
            e.preventDefault();
            setActive(0);
          } else if (e.key === 'End') {
            e.preventDefault();
            setActive(filtered.length - 1);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            select(activeIndex);
          } else if (e.key === 'Tab') {
            e.preventDefault();
          }
        });

        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
        if (searchBtn && !isMac) {
          const kbd = searchBtn.querySelector('kbd');
          if (kbd) kbd.textContent = 'ctrl';
        }
      })();
    </script>

    <script>
      (function() {
        const sections = Array.from(document.querySelectorAll('main section[id]')).filter(function(s) {
          return !s.classList.contains('hero');
        });
        if (!sections.length) return;

        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
        function motion() {
          return reduce && reduce.matches ? 'auto' : 'smooth';
        }

        const wrap = document.createElement('div');
        wrap.className = 'section-jump';
        wrap.innerHTML =
          '<button type="button" class="to-prev" aria-label="previous section" title="previous section (section up)"><i aria-hidden="true"></i></button>' +
          '<button type="button" class="to-next" aria-label="next section" title="next section (section down)"><i aria-hidden="true"></i></button>';
        document.body.appendChild(wrap);

        const prev = wrap.querySelector('.to-prev');
        const next = wrap.querySelector('.to-next');

        function offset() {
          const header = document.querySelector('.header');
          return (header ? header.offsetHeight : 0) + 12;
        }

        function tops() {
          return sections.map(function(s) {
            return s.getBoundingClientRect().top + window.pageYOffset;
          });
        }

        function stops() {
          const off = offset();
          return tops().map(function(t) { return Math.max(0, t - off); });
        }

        function goTop() {
          window.scrollTo({ top: 0, behavior: motion() });
        }

        function goBottom() {
          const footer = document.querySelector('.footer');
          const target = footer ? footer.getBoundingClientRect().top + window.pageYOffset : document.body.scrollHeight;
          window.scrollTo({ top: target - offset(), behavior: motion() });
        }

        prev.addEventListener('click', function() {
          const y = window.pageYOffset;
          const pos = stops();
          let target = -1;
          for (let i = pos.length - 1; i >= 0; i--) {
            if (pos[i] < y - 8) { target = pos[i]; break; }
          }
          if (target < 0) { goTop(); return; }
          window.scrollTo({ top: target, behavior: motion() });
        });

        next.addEventListener('click', function() {
          const y = window.pageYOffset;
          const pos = stops();
          let target = -1;
          for (let i = 0; i < pos.length; i++) {
            if (pos[i] > y + 8) { target = pos[i]; break; }
          }
          if (target < 0) { goBottom(); return; }
          window.scrollTo({ top: target, behavior: motion() });
        });

        function sync() {
          const y = window.pageYOffset;
          const vh = window.innerHeight;
          const total = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          prev.hidden = y <= 4;
          next.hidden = y + vh >= total - 4;
        }

        window.addEventListener('scroll', sync, { passive: true });
        window.addEventListener('resize', sync);
        sync();
      })();
    </script>
  </body>
</html>
